name: Auto-Sync Lockfile on Release PR

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-lockfile:
    name: Sync Lockfiles with Manifests
    # Only run on release-please branches to prevent desync on merge
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Regenerate and Commit Lockfiles
        run: |
          # 1. Update root pnpm lockfile if package.json bumped
          pnpm install --lockfile-only

          # 2. Update agent uv.lock if pyproject.toml bumped
          if [ -d "apps/agent" ]; then
            cd apps/agent && uv lock && cd ../..
          fi

          if [ -n "$(git status --porcelain pnpm-lock.yaml apps/agent/uv.lock 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml apps/agent/uv.lock 2>/dev/null || true
            git commit -m "chore(deps): auto-sync lockfiles for release version [skip ci]"
            git push
          else
            echo "All lockfiles are already up-to-date."
          fi
