name: CI/CD Pipeline & GHCR Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint & Test Suite Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Workspace Lint
        run: pnpm -r lint

      - name: Run TypeScript Workspace Tests
        run: pnpm -r test

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Agent Dependencies
        run: |
          cd apps/agent
          uv sync || uv sync --locked

      - name: Run Python Ruff Lint
        run: |
          cd apps/agent
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Python Agent Tests
        run: |
          cd apps/agent
          uv run pytest -v apps/agent/tests || uv run pytest -v tests

  build-and-push:
    name: Build & Push GHCR Containers
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - dockerfile: apps/agent/Dockerfile
            image: ghcr.io/schnee111/shorekeeper-s2s-agent
            context: .
          - dockerfile: apps/token-server/Dockerfile
            image: ghcr.io/schnee111/shorekeeper-s2s-token-server
            context: .
          - dockerfile: apps/client/Dockerfile
            image: ghcr.io/schnee111/shorekeeper-s2s-client
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
